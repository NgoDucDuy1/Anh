<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Tập Tiếng Anh 12 - Học & Giải Thích Tức Thì</title>
  <meta name="description" content="Trang web luyện tập trắc nghiệm Tiếng Anh tương tác trực tuyến với phản hồi tức thì và giải thích chi tiết cho từng đáp án đúng/sai.">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Main Style -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== HEADER NAVBAR ==================== -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>English Practice</h1>
          <p>Luyện tập & Phản hồi giải thích tức thì</p>
        </div>
      </div>

      <div class="nav-actions">
        <!-- Nút Làm lại bài -->
        <button id="headerResetBtn" class="header-action-btn" title="Làm lại Unit này">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>Làm lại</span>
        </button>

        <!-- Nút chuyển Dark / Light Mode -->
        <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Đổi giao diện Sáng/Tối" title="Chuyển sang giao diện Tối">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== UNIT SELECTION TABS ==================== -->
  <nav class="unit-nav-wrapper">
    <div class="container">
      <div class="unit-tabs" id="unitTabs">
        <!-- Render động bằng JS -->
      </div>
    </div>
  </nav>

  <!-- ==================== MAIN CONTENT AREA ==================== -->
  <main class="container" style="flex: 1; padding-bottom: 3rem;">
    <!-- Unit Header & Thống kê trực tiếp -->
    <div class="unit-header-card">
      <div class="unit-header-top">
        <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
          <span class="unit-tag" id="unitTag">UNIT 1</span>
          <h2 class="unit-title" id="unitTitle" style="margin: 0; font-size: 1.25rem;">LIFE STORIES WE ADMIRE</h2>
        </div>
        
        <div class="live-stats-bar">
          <span class="stat-badge stat-answered">Đã làm: <strong id="statAnswered">0/24</strong></span>
          <span class="stat-badge stat-correct">Đúng: <strong id="statCorrect">0</strong></span>
          <span class="stat-badge stat-wrong">Sai: <strong id="statWrong">0</strong></span>
        </div>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- Vùng hiển thị toàn bộ câu hỏi của Unit -->
    <div id="unitContent">
      <!-- Dynamic render via app.js -->
    </div>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="app-footer">
    <div class="container">
      <p>© 2026 English Interactive Practice • Bấm chọn để xem giải thích tức thì • Sẵn sàng triển khai trên GitHub & Vercel</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
